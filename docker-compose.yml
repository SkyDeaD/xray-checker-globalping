# Сервис проверок доступности: из мира (xray-checker) и из России (Globalping).
#
#   cp .env.example .env      # вписать PANEL_URL и PANEL_TOKEN
#   docker compose up -d      # страница на http://localhost:8080
#
# Колонка «из мира» появляется, если поднять ещё и xray-checker:
#   cp .env.checker.example .env.checker && docker compose --profile checker up -d
#
# Порт сервиса публикуется только на localhost: наружу отдавайте через свой
# обратный прокси (nginx/caddy), он же может закрыть страницу паролем.

services:
  probe:
    build: .
    container_name: xray-checker-globalping
    restart: unless-stopped
    env_file: .env
    environment:
      # Пусто — проверок «из мира» не будет. Для профиля checker:
      # CHECKER_URL=http://xray-checker:2112 (задать в .env).
      CHECKER_URL: ${CHECKER_URL-}
      DB_PATH: /data/status.db
    volumes:
      - probe-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Необязательный: «из мира». Запускается только с профилем checker.
  xray-checker:
    image: kutovoys/xray-checker:latest
    container_name: xray-checker
    profiles: [checker]
    restart: unless-stopped
    env_file: .env.checker
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  probe-data:
